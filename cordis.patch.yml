# dshm-backup profile registration（bundle patch）。
#
# 行 id 与包名一致（dshm-backup）：DSHM 的 .dshm-plugin-rows.yml 用这个 id
# 表达「这个插件启用/停用」，安装器与插件页也据此识别。
#
# 本插件是纯宿主插件（没有 cordis client 半身）：UI 由宿主在进程启动后
# 通过 webServer.tapIndex 注入 index.html 的单文件脚本提供，零静态 inject，
# 因此任何服务缺失都不会让本插件进入 pending。
- insert:
    - id: dshm-backup
      name: 'dshm-backup'
